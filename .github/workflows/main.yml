name: Update IPTV Source

on:
  schedule:
    # 每日香港時間 (UTC+8) 12:00 與 18:00 運行，對應 UTC 04:00 與 10:00
    - cron: '0 4,10 * * *'
  workflow_dispatch: # 支援手動觸發

# 两个工作流都会往 main 推提交，让它们排队而不是并发，避免后完成者被 non-fast-forward 拒掉
concurrency:
  group: main-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install System FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Run script
      run: python -u main.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add hk_live.m3u
        git commit -m "Auto-update channel list [skip ci]" || echo "No changes to commit"
        git pull --rebase --autostash origin main
        # 兜底：运行期间 main 若已被其他提交推进，把自己的提交接到后面再推
        git push
